name: Release

# Every push to main builds, tests and publishes a GitHub Release with the APK attached.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # GitHub's Ubuntu runners ship the Android SDK (ANDROID_HOME); no setup action needed.
      - uses: gradle/actions/setup-gradle@v4

      - name: Tests
        run: ./gradlew :core:test :app:testDebugUnitTest

      - name: Build release APK
        run: ./gradlew :app:assembleRelease

      - name: Name the release
        id: meta
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION-build.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          cp app/build/outputs/apk/release/app-release.apk "Rem-$VERSION.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Rem ${{ steps.meta.outputs.version }} (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: Rem-${{ steps.meta.outputs.version }}.apk
          body: |
            Install: download **Rem-${{ steps.meta.outputs.version }}.apk** on your Android phone and open it.
            You may need to allow "Install unknown apps" for your browser or file manager.

            This build is signed with a development key, so uninstall any earlier Rem build signed differently before installing.

            Commit: ${{ github.sha }}
